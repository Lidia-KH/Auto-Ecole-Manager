name: Build Electron App

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux Native Compilation Toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install Root Dependencies & Rebuild Native Modules
        run: |
          npm install
          npx electron-builder install-app-deps

      - name: Build Frontend Assets
        run: |
          cd renderer
          npm install
          npm run build
          cd ..

      - name: Package & Compile Electron Apps
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoEcole-${{ matrix.os }}
          path: release/*
