name: Build Electron App

on:
  push:
    branches:
      - main

jobs:
  build:

    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx electron-builder install-app-deps
      - run: cd renderer && npm install
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: AutoEcole-${{ matrix.os }}
          path: release/